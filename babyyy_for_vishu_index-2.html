<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Babyyy ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.65), transparent 28%),
      radial-gradient(circle at 80% 75%, rgba(255,190,215,.35), transparent 30%),
      linear-gradient(135deg, #fff4f8, #fce0eb 48%, #f7d2e1);
    color: #5b2438;
  }

  .glow {
    position: fixed;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,.28);
    filter: blur(35px);
    pointer-events: none;
  }
  .g1 { top: -90px; left: -70px; }
  .g2 { bottom: -100px; right: -70px; }

  .screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
  }

  .card {
    width: min(92vw, 540px);
    min-height: 590px;
    padding: 48px 30px 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 32px;
    background: rgba(255,255,255,.38);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(111,35,65,.16);
    animation: appear 1.4s ease;
    position: relative;
    z-index: 2;
  }

  .mini {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .65;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 12vw, 68px);
    font-weight: 500;
    letter-spacing: -2px;
    color: #7d2948;
    text-shadow: 0 4px 20px rgba(125,41,72,.12);
  }

  .butterfly {
    font-size: 34px;
    display: inline-block;
    animation: flutter 3s ease-in-out infinite;
  }

  .message {
    margin-top: 32px;
    min-height: 180px;
    max-width: 420px;
    font-size: clamp(18px, 4.8vw, 22px);
    line-height: 1.8;
  }

  .line {
    opacity: 0;
    transform: translateY(12px);
    animation: lineIn .9s ease forwards;
  }
  .line:nth-child(1) { animation-delay: .6s; }
  .line:nth-child(2) { animation-delay: 2s; }
  .line:nth-child(3) { animation-delay: 3.7s; }
  .line:nth-child(4) { animation-delay: 5.1s; }

  .love {
    margin-top: 22px;
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 8vw, 48px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #9b3158;
    opacity: 0;
    animation: loveIn 1.4s ease 6.2s forwards;
  }

  .signature {
    margin-top: 20px;
    font-size: 18px;
    font-style: italic;
    opacity: 0;
    animation: lineIn 1s ease 7.1s forwards;
  }

  .heart {
    display: inline-block;
    animation: heartbeat 1.3s ease-in-out infinite;
  }

  .float {
    position: fixed;
    bottom: -50px;
    font-size: 22px;
    opacity: 0;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 1;
  }

  .f1 { left: 8%; animation-duration: 9s; animation-delay: 0s; }
  .f2 { left: 25%; animation-duration: 11s; animation-delay: 2s; font-size: 18px; }
  .f3 { left: 48%; animation-duration: 10s; animation-delay: 4s; }
  .f4 { left: 70%; animation-duration: 12s; animation-delay: 1s; font-size: 19px; }
  .f5 { left: 88%; animation-duration: 9.5s; animation-delay: 5s; }

  .tap {
    position: absolute;
    bottom: 18px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .45;
  }

  @keyframes appear {
    from { opacity: 0; transform: scale(.96) translateY(15px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes lineIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes loveIn {
    0% { opacity: 0; transform: scale(.7); }
    65% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  @keyframes flutter {
    0%,100% { transform: translate(0,0) rotate(-5deg); }
    50% { transform: translate(5px,-9px) rotate(5deg); }
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: .72; }
    85% { opacity: .45; }
    100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  @media (max-height: 680px) {
    .card { min-height: 92vh; padding: 28px 24px; }
    .message { margin-top: 20px; min-height: 150px; line-height: 1.55; }
  }
</style>
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="float f1">🦋</div>
  <div class="float f2">♡</div>
  <div class="float f3">🦋</div>
  <div class="float f4">♥</div>
  <div class="float f5">🦋</div>

  <main class="screen">
    <section class="card">
      <div class="mini">a little something from Varsha</div>

      <div class="butterfly">🦋</div>
      <h1>Babyyy</h1>

      <div class="message">
        <div class="line">Maybe it’s just the beginning,</div>
        <div class="line">but somehow, you already make my heart feel a little different. 🥹</div>
        <div class="line">I don’t know where this journey takes us…</div>
        <div class="line">I just know I want to take the first step with you.</div>
      </div>

      <div class="love">I LOVE YOU <span class="heart">❤️</span></div>
      <div class="signature">— Varsha 🫶🏻</div>

      <div class="tap">made with a little love</div>
    </section>
  </main>
</body>
</html>
